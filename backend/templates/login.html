{% extends "base.html" %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1>RetailGPT</h1>
            <p>Enterprise Decision Intelligence Platform</p>
        </div>
        <div class="login-tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Log In</button>
            <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>
        
        <form id="login-form" class="auth-form active">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="login-username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn-primary">Log In</button>
            <p id="login-error" class="error-msg"></p>
        </form>

        <form id="signup-form" class="auth-form" style="display: none;">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signup-name" required>
            </div>
            <div class="form-group">
                <label>Corporate Email</label>
                <input type="email" id="signup-email" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="signup-username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signup-password" required>
            </div>
            <button type="submit" class="btn-primary">Sign Up</button>
            <p id="signup-msg" class="message-text"></p>
        </form>
    </div>
</div>

<script>
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(form => form.style.display = 'none');
        if (tab === 'login') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('login-form').style.display = 'block';
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('signup-form').style.display = 'block';
        }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        if (res.ok) {
            window.location.href = '/dashboard';
        } else {
            const data = await res.json();
            document.getElementById('login-error').innerText = data.detail || 'Login failed';
        }
    });

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('signup-name').value;
        const email = document.getElementById('signup-email').value;
        const username = document.getElementById('signup-username').value;
        const password = document.getElementById('signup-password').value;
        const res = await fetch('/api/auth/signup', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, email, username, password})
        });
        const msgEl = document.getElementById('signup-msg');
        if (res.ok) {
            msgEl.style.color = '#10B981';
            msgEl.innerText = 'Account created successfully! You can now log in.';
        } else {
            const data = await res.json();
            msgEl.style.color = '#EF4444';
            msgEl.innerText = data.detail || 'Signup failed';
        }
    });
</script>
{% endblock %}
